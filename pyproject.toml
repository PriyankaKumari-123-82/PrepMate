[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prepmate"
version = "0.1.0"
description = "Page-grounded textbook practice and RAG API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115,<0.116",
  "email-validator>=2.2",
  "httpx>=0.27",
  "openai>=1.50",
  "passlib[bcrypt]>=1.7",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "PyJWT>=2.9",
  "PyMuPDF>=1.24",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
