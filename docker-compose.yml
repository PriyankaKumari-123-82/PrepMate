services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prepmate
      POSTGRES_USER: prepmate
      POSTGRES_PASSWORD: prepmate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepmate"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: ["uploads:/data/uploads"]
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on:
      - api
volumes:
  postgres_data:
  uploads:
